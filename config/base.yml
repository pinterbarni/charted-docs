site_name: Charted Docs
site_url: https://pinterbarni.github.io/charted-docs/
repo_url: https://github.com/pinterbarni/charted-docs
copyright: Created by <a href="https://github.com/pinterbarni">pinterbarni</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant.preview
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - announce.dismiss

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [diagrams, snippets]
      check_paths: true
  - toc:
      permalink: true
  - plantuml_markdown:
      format: svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  anchors: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pinterbarni
  version:
    provider: mike
    default: latest

extra_css:
  - assets/stylesheets/diagram-zoom.css

extra_javascript:
  - assets/javascripts/diagram-zoom.js
