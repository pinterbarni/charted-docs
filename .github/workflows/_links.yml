name: Links

on:
  workflow_call:

env:
  NO_MKDOCS_2_WARNING: 1

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PlantUML
        uses: ./.github/actions/setup-plantuml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build site
        run: uv run mkdocs build

      - name: Serve site under its Pages path
        run: |
          mkdir -p /tmp/serve
          ln -s "$PWD/site" "/tmp/serve/${{ github.event.repository.name }}"
          python3 -m http.server -d /tmp/serve 8001 &
          sleep 1

      - name: Check internal links
        run: uvx linkchecker --no-warnings "http://127.0.0.1:8001/${{ github.event.repository.name }}/"
