name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml

  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: write

  progress:
    name: Progress
    uses: ./.github/workflows/_progress.yml

  spellcheck:
    name: Spelling
    uses: ./.github/workflows/_spellcheck.yml
