name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml

  links:
    name: Links
    needs: build
    uses: ./.github/workflows/_links.yml

  deploy:
    name: Deploy
    needs: [build, links]
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: write

  content:
    name: Content
    uses: ./.github/workflows/_progress.yml
    with:
      script: content-progress.sh
      title: Content progress

  descriptions:
    name: Descriptions
    uses: ./.github/workflows/_progress.yml
    with:
      script: description-progress.sh
      title: Description progress

  spellcheck:
    name: Spelling
    uses: ./.github/workflows/_spellcheck.yml
