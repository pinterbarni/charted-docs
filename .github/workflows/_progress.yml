name: Progress

on:
  workflow_call:
    inputs:
      script:
        description: Progress script in scripts/ to run
        required: true
        type: string
      title:
        description: Job name shown in the workflow graph
        required: true
        type: string

jobs:
  report:
    name: ${{ inputs.title }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Report progress
        run: bash "scripts/${{ inputs.script }}"
