site_name: Charted Docs
site_url: https://pinterbarni.github.io/charted-docs/
repo_url: https://github.com/pinterbarni/charted-docs
copyright: Created by <a href="https://github.com/pinterbarni">pinterbarni</a>

theme:
  name: material
  language: en
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: hu
          name: Magyar
          build: true
          copyright: Készítette <a href="https://github.com/pinterbarni">pinterbarni</a>

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pinterbarni
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Introduction:
      - introduction/index.md
      - The Charted app: introduction/charted-app.md
      - Goals and motivation: introduction/goals-and-motivation.md
      - Scope and limitations: introduction/scope-and-limitations.md
      - Technologies used: introduction/technologies.md
      - Structure of the thesis: introduction/thesis-structure.md
  - User guide:
      - user-guide/index.md
      - System requirements: user-guide/system-requirements.md
      - Registration and sign-in: user-guide/sign-up-and-sign-in.md
      - Profile and settings: user-guide/profile-and-settings.md
      - Planning a hiking route: user-guide/route-planning.md
      - Starting route planning: user-guide/start-route-planning.md
      - Rotating and tilting the map: user-guide/map-rotation-and-tilt.md
      - Placing points (POIs): user-guide/placing-pois.md
      - Saving a hike draft: user-guide/saving-drafts.md
      - Reloading a route (retrack): user-guide/retrack.md
      - Recording and saving hikes: user-guide/recording-hikes.md
      - Browsing and sharing hikes: user-guide/browsing-and-sharing.md
      - Social features: user-guide/social-features.md
      - Settings and localization: user-guide/settings-and-localization.md
