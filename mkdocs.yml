site_name: Charted Docs
site_url: https://pinterbarni.github.io/charted-docs/
repo_url: https://github.com/pinterbarni/charted-docs
copyright: Created by <a href="https://github.com/pinterbarni">pinterbarni</a>

theme:
  name: material
  language: en
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: hu
          name: Magyar
          build: true
          copyright: Készítette <a href="https://github.com/pinterbarni">pinterbarni</a>
          nav_translations:
            Home: Kezdőlap
            Introduction: Bevezetés
            The Charted app: A Charted alkalmazás
            Goals and motivation: Cél és motiváció
            Scope and limitations: Hatókör és korlátok
            Technologies used: Felhasznált technológiák
            Structure of the thesis: A dolgozat szerkezete
            User guide: Felhasználói dokumentáció
            System requirements: Rendszerkövetelmények
            Registration and sign-in: Regisztráció és bejelentkezés
            Profile and settings: Profil és beállítások
            Planning a hiking route: Túraútvonal tervezése
            Starting route planning: Útvonal tervezés indítása
            Rotating and tilting the map: Térkép forgatása, döntése
            Placing points (POIs): Pontok (POI-k) elhelyezése
            Saving a hike draft: Túra tervezet mentése
            Reloading a route (retrack): Útvonal visszatöltése
            Recording and saving hikes: Túra rögzítése és mentése
            Browsing and sharing hikes: Túrák böngészése és megosztása
            Social features: Közösségi funkciók
            Settings and localization: Beállítások és lokalizáció
            Developer guide: Fejlesztői dokumentáció
            Design: Tervezés
            UI/UX design: UI/UX tervezés
            Gathering requirements: Követelmények
            Choosing technologies: Technológiaválasztás
            Data model design: Adatmodell tervezése
            System architecture: Rendszerarchitektúra
            Infrastructure: Infrastruktúra
            Backend and BFF: Backend és BFF
            Mobile app: Mobil alkalmazás
            Development methodology: Fejlesztési módszertan
            Architectural decisions: Architekturális döntések
            Technology stack: Technológiai stack
            Module structure: Modulstruktúra
            Database model: Adatbázis modell
            Authentication: Autentikáció
            API endpoints: API végpontok
            Gamification: Gamifikáció
            Proxy modules: Proxy modulok
            Code quality: Kódminőség
            EAS and development: EAS és fejlesztés
            Navigation: Navigáció
            Map integration: Térképintegráció
            Route handling: Útvonalkezelés
            Recording and GPS: Túrarögzítés és GPS
            State management: Állapotkezelés
            Offline features: Offline funkciók
            Design system: Design rendszer
            Localization: Lokalizáció
            Deployment and operations: Telepítés és üzemeltetés
            Development environment: Fejlesztői környezet
            Docker and infrastructure: Docker és infrastruktúra
            Configuration: Konfiguráció
            Test cases: Tesztesetek
            Permissions: Jogosultságok
            Profile: Profil
            Routes and core: Túraútvonal és core funkciók
            Settings: Beállítások
            Offline operation: Offline működés
            Summary: Összefoglalás
            Challenges and solutions: Nehézségek és megoldások
            V2 opportunities: V2 fejlesztési lehetőségek
            Closing thoughts: Záró gondolatok

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pinterbarni
  version:
    provider: mike
    default: latest

